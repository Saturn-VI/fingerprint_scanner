; PlatformIO Project Configuration File
;cc
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_feather]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
build_flags = 
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_HID
    -I $PROJECT_PACKAGES_DIR/framework-arduinopico/libraries/tusb-hid/src
board = adafruit_feather
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 2m
monitor_speed = 115200
extra_scripts = post:wait_for_port.py
lib_deps = 
	adafruit/Adafruit LiquidCrystal@^2.0.4
	adafruit/Adafruit TCA8418@^1.0.2
	adafruit/Adafruit Fingerprint Sensor Library@^2.1.4
	tusb-hid
	LittleFS
